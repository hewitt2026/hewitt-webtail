name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Job 1: Go 1.22 - modern binaries for Win 10/11, Server 2016+
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Job 2: Go 1.20 - legacy Windows binary for Server 2012 R2
  release-legacy:
    needs: release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.20"

      - name: Build legacy Windows binary
        run: |
          go build -o gwebtail.exe -ldflags "-s -w" .

      - name: Create zip archive
        run: |
          Compress-Archive -Path gwebtail.exe, LICENSE, README.md -DestinationPath hewitt-webtail_${{ github.ref_name }}_win_legacy_amd64.zip

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: hewitt-webtail_${{ github.ref_name }}_win_legacy_amd64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
